; Daredevil bracelet firmware (Seeed XIAO ESP32-C3, Arduino framework).
; Build one image per wrist:  pio run -e left -t upload  /  pio run -e right -t upload
; Run the logic tests on this computer (no board needed):  pio test -e native

[platformio]
default_envs = left, right

[esp32]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
build_flags =
    ; Route Serial over the C3's native USB (shows up as /dev/ttyACM* on the Jetson)
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:left]
extends = esp32
build_flags =
    ${esp32.build_flags}
    -DBRACELET_SIDE=0

[env:right]
extends = esp32
build_flags =
    ${esp32.build_flags}
    -DBRACELET_SIDE=1

; Host build for unit tests: only the hardware-free headers in include/ are used.
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17
