; Daredevil bracelet firmware (Seeed XIAO ESP32-C3, Arduino framework).
; Build one image per wrist:  pio run -e left -t upload  /  pio run -e right -t upload

[env]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
build_flags =
    ; Route Serial over the C3's native USB (shows up as /dev/ttyACM* on the Jetson)
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:left]
build_flags =
    ${env.build_flags}
    -DBRACELET_SIDE=0

[env:right]
build_flags =
    ${env.build_flags}
    -DBRACELET_SIDE=1
